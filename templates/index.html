<!DOCTYPE html>
    <html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content = "width=device-width, initial-scale=1.0">
        <title>Awesome History Bot</title>
        <style>
            body {font-family: Arial; max-width: 500px; margin: 50px auto; padding: 20px;}
            textarea {width: 100%; height : 100px; margin-bottom: 10px; }
            button {padding: 10px 20px; cursor: pointer;}
            #output {margin-top : 20px; padding: 15px; background: #2E7D32; border-radius: 5px; white-space: pre-wrap;}
        </style>
    </head>
    <body>
        <Img src="https://upload.wikimedia.org/wikipedia/commons/6/66/Einstein_1921_by_F_Schmutzer.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt = "Picture of Albert Einstein in 1921 famous figure" width="100%">
        <h1>Hello, ask me anything.</h1>
        <form id="aiForm">
            <textarea id = "promptInput" placeholder="What do you have to ask...?" required></textarea>
            <button type= "submit" id="submitBtn">Ask me anything...</button>
        </form>

        <h3>Response:</h3>
        <div id = "output">AI response will appear here...</div>

    <script>
        let history = [];
        document.getElementById('aiForm').addEventListener('submit',async (e) => {
            e.preventDefault();
            const backend_url = "/api/chat";
            const promptInput = document.getElementById("promptInput") ;
            const submitBtn = document.getElementById("submitBtn");
            const outputDiv = document.getElementById("output");
            submitBtn.disabled = true;
            outputDiv.textContent = 'Hmm...'
        
            try {
                history.push({role:"user", content: promptInput.value});
                const response = await fetch(backend_url,{
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ messages: history})
                });

                if (!response.ok) {
                    throw new Error(`Server Error:${response.status} Fix code`);
                }
                const data = await response.json();
                history.push({ role: "assistant", content: data.reply });
                outputDiv.textContent = data.reply;
                promptInput.value= "";
            } 
            catch (error) {
                history.pop();
                outputDiv.textContent = `Error: ${error.message}`;
                console.error('Connection failed', error);
            }
            finally {
                submitBtn.disabled = false}
            });
    </script>
    </body>
    </html>
